name: publish

# Publishes the package to npm when a version tag is pushed, and attaches the
# built module to a GitHub release. The tag must match package.json's version:
#
#   npm version 0.2.0 --no-git-tag-version   # or edit package.json by hand
#   git commit -am "chore: release 0.2.0" && git tag v0.2.0
#   git push origin main v0.2.0
#
# dist/ is never committed, so the module is built here from the same pinned
# toolchain as build.yml before it is packed. Authentication is npm Trusted
# Publishing (OIDC, id-token: write) when it is configured for the package on
# npmjs.com; until then, or as a fallback, an NPM_TOKEN repository secret is
# used (a granular access token with publish rights and 2FA bypass).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish megane-rdkit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RDKIT_TAG: Release_2026_03_6
      BOOST_VERSION: 1.87.0
      ZLIB_TAG: v1.3.1
      EMSDK_VERSION: 6.0.9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev

      - name: Cache toolchain and RDKit build tree
        uses: actions/cache@v4
        with:
          path: .deps
          key: megane-rdkit-deps-${{ github.event.repository.name }}-${{ runner.os }}-${{ env.RDKIT_TAG }}-${{ env.BOOST_VERSION }}-${{ env.ZLIB_TAG }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/build.sh') }}

      - name: Build
        run: bash scripts/build.sh

      - name: Pack
        run: |
          npm pack
          tar tzf megane-rdkit-*.tgz | tee pack.txt
          grep -q 'package/dist/megane-rdkit.wasm' pack.txt
          grep -q 'package/dist/megane-rdkit.mjs' pack.txt
          grep -q 'package/THIRD_PARTY_LICENSES.md' pack.txt

      - name: Publish to npm
        if: github.event_name == 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Authenticating with the NPM_TOKEN secret"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          else
            echo "No NPM_TOKEN secret: relying on npm trusted publishing (OIDC)"
          fi
          npm publish megane-rdkit-*.tgz

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "megane-rdkit ${GITHUB_REF_NAME} (RDKit ${RDKIT_TAG}). Published to npm as megane-rdkit@${GITHUB_REF_NAME#v}." \
            megane-rdkit-*.tgz dist/megane-rdkit.mjs dist/megane-rdkit.wasm
