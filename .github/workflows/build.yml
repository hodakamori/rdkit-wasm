name: build

# Builds RDKit's ETKDG embedding to WebAssembly and uploads dist/ as an
# artifact. The RDKit compile is the slow part (tens of minutes), so .deps is
# cached on the pinned versions in scripts/build.sh; a cache hit only relinks
# the wrapper.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: megane-rdkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build megane-rdkit.wasm
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RDKIT_TAG: Release_2026_03_6
      BOOST_VERSION: 1.87.0
      ZLIB_TAG: v1.3.1
      EMSDK_VERSION: 6.0.9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev

      - name: Cache toolchain and RDKit build tree
        uses: actions/cache@v4
        with:
          path: .deps
          key: megane-rdkit-deps-${{ runner.os }}-${{ env.RDKIT_TAG }}-${{ env.BOOST_VERSION }}-${{ env.ZLIB_TAG }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/build.sh') }}

      - name: Fetch dependencies
        run: bash scripts/build.sh deps

      - name: Build RDKit static libraries
        run: bash scripts/build.sh rdkit

      - name: Build wrapper
        run: bash scripts/build.sh wrapper

      - name: Smoke test
        run: node test/smoke.mjs

      - name: Report size
        run: |
          ls -la dist
          echo "megane-rdkit.wasm gzipped bytes: $(gzip -c dist/megane-rdkit.wasm | wc -c)"

      - uses: actions/upload-artifact@v4
        with:
          name: megane-rdkit-${{ env.RDKIT_TAG }}
          path: |
            dist/megane-rdkit.mjs
            dist/megane-rdkit.wasm
          if-no-files-found: error
